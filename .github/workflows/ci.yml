name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # LDC only: libfp refuses DMD at compile time (see its README).
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # Homebrew's OpenSSL is keg-only, so the linker needs its path.
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Run unittests
        run: dub test --compiler=ldc2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check documentation examples
        run: python tools/doctest.py

      - name: Lint layering, naming and wrappers
        run: python tools/lint.py

      - name: Build static library
        run: dub build --config=library --compiler=ldc2

  wasi:
    name: wasm32-wasi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Run unittests under Node
        run: python3 tools/wasi.py --node

      - name: Run unittests in headless Firefox
        run: python3 tools/wasi.py --browser
